services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@postgres:5432/inventory_booking
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      INTERNAL_API_TOKEN: local-dev-token
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/alembic:/app/alembic
      - ./backend/src:/app/src
      - asset-uploads:/app/data/uploads
    command: ["uv", "run", "uvicorn", "inventory_booking_api.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      target: build
    environment:
      PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      PUBLIC_APP_BASE_URL: http://127.0.0.1:5173
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/static:/app/static
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
